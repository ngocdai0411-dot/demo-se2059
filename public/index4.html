<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Wxercise 8: Demo about Form Control</title>
</head>
<body>
    <div class="container my-4" style="max-width: 500px;">
        <h1 class="fw-bold mb-3">Form đặt vé máy bay</h1>
        
        <label for="hoten" class="form-label mb-1">Họ tên</label>
        <div class="input-group">
            <span class="input-group-text bg-light text-secondart">
                <i class="bi bi-person"></i>
            </span>
            <input type="text" class="form-control" id="hoten" placeholder="Họ tên">
            <span class="input-group-text bg-light text-secondart">vnđ</span>
        </div>
        <div class="form-text text-muted">Phải nhập 5 kí tự, in hoa...</div>

        <br>
        <div class="mb-3">
            <label for="diachi" class="form-label mb-1">Địa chỉ</label>
            <input type="text" class="form-control">
            <div class="form-text text-muted">Phải nhập 5 kí tự, in hoa...</div>
        </div>
        <br>
        <div class="row mb-3">
            <div class="col-6">
                <label for="ditu" class="form-label mb-1">Đi từ</label>
                <select class="form-select" id="ditu">
                    <option selected>Hà Nội</option>
                </select>
            </div>
            <div class="col-6">
                <label for="den" class="form-label mb-1">Đến</label>
                <select class="form-select" id="den">
                    <option selected>Hà Nội</option>
                </select>
            </div>
        </div>
        <br>
        <div class="mb-4">
            <label class="form-label mb-1">Chọn chiều đi(khứ hồi)</label>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="chieudi">
                <label class="form-check-label" for="chieudi">Đi</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="chieuve">
                <label class="form-check-label" for="chieuve">Về</label>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Đặt vé</button>
    </div>
        <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
</body>
</html>
